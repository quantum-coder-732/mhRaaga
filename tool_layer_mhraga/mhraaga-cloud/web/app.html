<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compose · mhRaaga</title>
<meta name="description" content="Compose raga music from a sentence. Krishna's sixteen thousand ragas, tanpura, bansuri and tabla in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231b1646'/%3E%3Cpath d='M9 21c4-10 10-10 14 0' stroke='%23f4b942' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<nav class="nav" data-page="app"></nav>

<main id="app" hidden>
  <section class="card compose">
    <div class="tabs" role="tablist"><button type="button" class="on" data-tab="songs" role="tab">Songs</button><button type="button" data-tab="speech" role="tab">Speech</button></div>
    <div id="songs-pane">
    <div class="seg" id="mode"><button type="button" data-mode="simple">Simple</button><button type="button" data-mode="adv" class="on">Advanced</button></div>
    <label class="field">
      <span>Describe the song <em>(type or speak)</em></span>
      <div class="withmic">
        <textarea id="prompt" rows="3" maxlength="800" placeholder="A Krishna bansuri bhajan for the dawn, gentle and flowing…"></textarea>
        <button class="mic" id="mic-prompt" type="button" title="Speak your idea" aria-label="Speak your idea">🎙</button>
      </div>
    </label>
    <label class="field adv"><span>Styles <em>(words that shape the music, like Suno: genre, mood, instruments)</em></span><input id="styletext" maxlength="200" placeholder="sufi qawwali, harmonium, dholak, handclaps, building crescendo" autocomplete="off"></label>
    <div class="adv"><div class="styles" id="styles" role="group" aria-label="Styles">
      <span class="lab">Styles</span>
      <button type="button" class="tag krishna" data-tag="poem">📜 Spoken poem <i>like a poem video</i></button>
      <button type="button" class="tag krishna" data-tag="krishna">🪈 Krishna flute <i>auto raga</i></button>
      <button type="button" class="tag" data-tag="devotional">devotional</button><button type="button" class="tag" data-tag="dawn">dawn</button>
      <button type="button" class="tag" data-tag="rain">rain</button><button type="button" class="tag" data-tag="night">night</button>
      <button type="button" class="tag" data-tag="romantic">romantic</button><button type="button" class="tag" data-tag="meditative">meditative</button>
      <button type="button" class="tag" data-tag="joyful">joyful</button><button type="button" class="tag" data-tag="bhajan">bhajan</button>
      <button type="button" class="tag" data-lead="bansuri">bansuri</button><button type="button" class="tag" data-lead="veena">veena</button><button type="button" class="tag" data-lead="harmonium">harmonium</button>
    </div>
    </div>
    <div class="grid adv">
      <label class="field"><span>Raga</span>
        <select id="raga"><option value="">Let the AI choose</option><optgroup id="og-classical" label="Classical"></optgroup></select></label>
      <label class="field"><span>Tāla</span><select id="tala"><option value="">Raga's own</option></select></label>
      <label class="field"><span>Language</span><select id="language"><option value="">Auto</option><option>hindi</option><option>marathi</option><option>sanskrit</option><option>english</option><option>telugu</option><option>gujarati</option><option>kannada</option><option>tamil</option></select></label>
      <label class="field"><span>Lead</span><select id="lead"><option value="">Auto</option><option value="bansuri">Bansurī (flute)</option><option value="harmonium">Harmonium</option><option value="veena">Vīṇā</option></select></label>
      <input id="tonic" type="hidden" value="">
      <label class="field"><span>Tempo <b id="tempo-v">auto</b></span><input id="tempo" type="range" min="40" max="160" value="40"></label>
      <label class="field"><span>Length <b id="dur-v">90 s</b></span><input id="dur" type="range" min="40" max="180" step="10" value="90"></label>
    </div>
    <label class="field adv"><span>Song title <em>(optional)</em></span><input id="title" maxlength="60" placeholder="Leave blank and the planner names it"></label>
    <label class="check adv"><input id="instr" type="checkbox"> Instrumental (no lyrics)</label>
    <details class="adv">
      <summary>Write my own lyrics</summary>
      <div class="withmic"><textarea id="lyrics" rows="4" maxlength="3000" placeholder="[Mukhda]&#10;…&#10;[Antara]&#10;…"></textarea><button class="mic" id="mic-lyrics" type="button" aria-label="Speak lyrics">🎙</button></div>
    </details>
    <div class="actions">
      <button id="go" class="primary">Compose</button>
      <button id="surprise" class="ghost" type="button">Surprise me</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
    </div>
    <div id="speech-pane" hidden>
      <label class="field"><span>Script <em>(type, dictate, or paste a transcript, e.g. from a video's “Show transcript”)</em></span>
        <div class="withmic"><textarea id="sp-text" rows="6" maxlength="2500" placeholder="Write or paste your speech"></textarea><button class="mic" id="sp-mic" type="button" aria-label="Dictate">🎙</button></div></label>
      <div class="grid">
        <label class="field"><span>I'm speaking in</span><select id="sp-stt"></select></label>
        <label class="field"><span>Translate to</span><div class="row"><select id="sp-to"></select><button type="button" id="sp-tr" class="ghost">Translate</button></div></label>
      </div>
      <div class="styles" id="sp-tone"><span class="lab">Tone</span></div>
      <div class="grid">
        <label class="field"><span>Voice type</span><select id="sp-vg"><option value="male">AI voice · male</option><option value="female">AI voice · female</option><option value="device">Device voice</option></select></label>
        <label class="field"><span>Device vocal gender</span><select id="sp-gender"><option value="">Any</option><option value="f">Female</option><option value="m">Male</option></select></label>
        <label class="field"><span>Voice</span><select id="sp-voice"></select></label>
        <label class="field"><span>Background music</span><select id="sp-bg"><option value="1">On: raga bed</option><option value="0">Off</option></select></label>
        <label class="field"><span>Variety <b id="sp-var-v">3</b></span><input id="sp-var" type="range" min="1" max="7" value="3"></label>
      </div>
      <div class="actions"><button id="sp-go" class="primary" type="button">Speak</button><button id="sp-stop" class="ghost" type="button">Stop</button><span id="sp-status" role="status"></span></div>
      <details><summary>Test the voices on this device</summary><div id="sp-voices" class="vlist"></div></details>
    </div>
  </section>

  <section class="card player" id="player" hidden>
    <div class="title-row"><h2 id="s-title"></h2><div class="chips" id="chips"></div></div>
    <p id="s-info" class="muted"></p>
    <canvas id="roll" width="900" height="240" aria-label="Notes of the raga as they play"></canvas>
    <div id="lyric-now" class="lyric-now" aria-live="polite"></div>
    <div class="transport">
      <button id="play" class="primary round" aria-label="Play">▶</button>
      <button id="stop" class="ghost round" aria-label="Stop">■</button>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position"><span id="clock">0:00</span>
      <input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume" class="vol">
    </div>
    <div class="actions">
      <label class="check"><input id="sing" type="checkbox" checked> Voice: sing the lyrics aloud</label>
      <select id="vg" aria-label="Voice type"><option value="male">AI voice · male</option><option value="female">AI voice · female</option><option value="device">Device voice</option></select>
      <select id="voice" aria-label="Device voice"></select>
      <button id="mp3" class="ghost" type="button">Download MP3</button>
      <button id="wav" class="ghost" type="button">Download WAV</button>
      <button id="del" class="ghost danger" type="button">Delete</button>
    </div>
    <details><summary>Lyrics</summary><pre id="lyrics-out"></pre></details>
  </section>

  <section class="card library"><h2>Community playlist</h2><ul id="plist"></ul><p id="pempty" class="muted">Loading…</p></section>

  <section class="card library" id="library"><h2>Your songs</h2><ul id="songs"></ul><p id="empty" class="muted">Nothing yet. Compose your first raga.</p></section>
</main>

<div id="toast" class="toast" role="status" hidden></div>
<script src="lame.min.js"></script><script type="module" src="site.js"></script>
<script type="module" src="app.js"></script>
<script type="module" src="speech.js"></script>
</body>
</html>
