/rect><text style=""><tspan xml:space="preserve" dy="1em" x="0" class="row">LangGraph track: a real interrupt() —</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">the graph genuinely pauses, checkpoint</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">persists, next invoke() resumes it.</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">Native track: pendingConfirmation is</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">persisted to ChatSessions and read back</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">on the next turn instead.</tspan></text></g></g></g></g></g></svg>