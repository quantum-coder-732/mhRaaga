[]</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">rule_id, severity, real file:line,</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">the actual matched snippet</tspan></text></g></g><g class="node default default flowchart-label" id="flowchart-LLM-48" data-node="true" data-id="LLM" transform="translate(1736.1171875, 146)"><rect class="basic label-container" style="" rx="0" ry="0" x="-172.46875" y="-32.5" width="344.9375" height="65"></rect><g class="label" style="" transform="translate(0, -25)"><rect></rect><text style=""><tspan xml:space="preserve" dy="1em" x="0" class="row">LLM summarizes ONLY this list —</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">never invents, adds, or omits a finding</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">(security_findings.format_findings_for_prompt)</tspan></text></g></g><g class="node default default flowchart-label" id="flowchart-OUT-50" data-node="true" data-id="OUT" transform="translate(2112.3671875, 146)"><rect class="basic label-container" style="" rx="0" ry="0" x="-153.78125" y="-32" width="307.5625" height="64"></rect><g class="label" style="" transform="translate(0, -24.5)"><rect></rect><text style=""><tspan xml:space="preserve" dy="1em" x="0" class="row">Grouped-by-severity summary +</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">raw Finding[] always in AgentResult.raw</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">(never lost even if the LLM call itself fails)</tspan></text></g></g></g></g></g></svg>