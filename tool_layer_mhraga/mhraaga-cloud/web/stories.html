<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stories · mhRaaga</title>
<meta name="theme-color" content="#120f2e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231b1646'/%3E%3Cpath d='M9 21c4-10 10-10 14 0' stroke='%23f4b942' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="site.css">
</head><body>
<nav class="nav" data-page="stories"></nav>
<main class="wrap pg">
  <h1>Stories, pravachan &amp; explainers</h1>
  <p class="muted">Describe a topic. The AI plans sections, writes each one, and your device narrates them over a soft raga, scene by scene. From 1 to 30 minutes.</p>
  <section class="card">
    <div class="tabs" id="kind"><button type="button" class="on" data-k="story">Story</button><button type="button" data-k="pravachan">Pravachan</button><button type="button" data-k="explainer">Explainer</button></div>
    <label class="field"><span>Topic</span><textarea id="topic" rows="3" maxlength="400" placeholder="A shepherd boy who learns patience from the river"></textarea></label>
    <div class="grid">
      <label class="field"><span>Length <b id="min-v">5 min</b></span><input id="min" type="range" min="1" max="30" value="5"></label>
      <label class="field"><span>Language</span><select id="lang"><option>english</option><option>hindi</option><option>marathi</option><option>telugu</option><option>gujarati</option><option>kannada</option><option>tamil</option></select></label>
      <label class="field"><span>Speak in the manner of <em>(your People)</em></span><select id="person"><option value="">Neutral narrator</option></select></label>
      <label class="field"><span>Voice</span><select id="voice"></select></label>
    </div>
    <label class="check"><input id="bg" type="checkbox" checked> Soft raga music underneath</label>
    <div class="actions"><button id="make" class="primary" type="button">Write it</button><button id="play" class="ghost" type="button" disabled>▶ Play</button><button id="stop" class="ghost" type="button">Stop</button><span id="status" role="status"></span></div>
    <div class="bar"><i id="bar"></i></div>
  </section>
  <section id="stage" class="stage" hidden><div class="stage-in"><div id="st-head" class="st-head"></div><div id="st-text" class="st-text"></div><ul id="st-pts" class="st-pts"></ul></div></section>
  <section class="card" id="script-card" hidden><h2>Script</h2><div id="script"></div></section>
</main>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="site.js"></script><script type="module" src="stories.js"></script>
</body></html>
